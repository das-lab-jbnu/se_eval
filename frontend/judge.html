<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>학생 평가</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <header>
      <h1>학생 평가</h1>
      <nav>
        <a href="/">운영자</a>
        <a href="/judge">학생 평가</a>
        <a href="/professor">교수 평가</a>
      </nav>
    </header>
    <main>
      <form id="evaluationForm">
        <section class="panel">
          <h2 id="presenter">현재 발표자</h2>
          <label>
            심사위원 이름
            <select id="evaluatorName"></select>
          </label>
        </section>
        <section id="criteria" class="criteria"></section>
        <section class="panel">
          <label>
            코멘트
            <textarea name="comment" placeholder="선택 입력"></textarea>
          </label>
        </section>
        <div class="form-actions">
          <p class="message" data-message></p>
          <button class="primary" type="submit">평가 제출</button>
        </div>
      </form>
    </main>
    <script src="/static/app.js"></script>
    <script>window.seEval.initEvaluation("student");</script>
  </body>
</html>
